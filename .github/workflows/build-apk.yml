name: Build WaliBell Play Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Play AAB
        run: |
          gradle clean bundleRelease --no-daemon

      - name: Verify AAB
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab
          file app/build/outputs/bundle/release/app-release.aab

      - name: Prepare AAB
        run: |
          mkdir -p release
          cp app/build/outputs/bundle/release/app-release.aab release/WaliBell_V4.0-Play.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WaliBell-V4.0-Play-AAB
          path: release/WaliBell_V4.0-Play.aab
          if-no-files-found: error
