name: Build WaliBell APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WaliBell_V3.2_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract WaliBell source
        run: |
          rm -rf walibell
          mkdir walibell
          unzip -q WaliBell_V3.2_Source.zip -d walibell
          test -f walibell/settings.gradle
          test -f walibell/app/build.gradle

      - name: Build debug APK
        working-directory: walibell
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp walibell/app/build/outputs/apk/debug/app-debug.apk release/WaliBell_V3.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaliBell-V3.2-APK
          path: release/WaliBell_V3.2.apk
          if-no-files-found: error
