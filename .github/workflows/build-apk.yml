name: Build WaliBell Play Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore release keystore
        env:
          WALIBELL_KEYSTORE_BASE64: ${{ secrets.WALIBELL_KEYSTORE_BASE64 }}
        run: |
          test -n "$WALIBELL_KEYSTORE_BASE64"
          echo "$WALIBELL_KEYSTORE_BASE64" | base64 --decode > app/walibell-upload-key.jks
          test -s app/walibell-upload-key.jks

      - name: Build Play AAB and Release APK
        env:
          RELEASE_KEYSTORE_FILE: walibell-upload-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          gradle clean bundleRelease assembleRelease --no-daemon

      - name: Verify AAB and APK
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/bundle/release/app-release.aab
          file app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/bundle/release/app-release.aab release/WaliBell_V4.4-Play.aab
          cp app/build/outputs/apk/release/app-release.apk release/WaliBell_V4.4-Free.apk

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: WaliBell-V4.4-Play-AAB
          path: release/WaliBell_V4.4-Play.aab
          if-no-files-found: error

      - name: Upload Free APK
        uses: actions/upload-artifact@v4
        with:
          name: WaliBell-V4.4-Free-APK
          path: release/WaliBell_V4.4-Free.apk
          if-no-files-found: error
