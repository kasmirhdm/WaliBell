plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
}

android {
    namespace 'com.walinet.walibell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.walinet.walibell'
        minSdk 23
        targetSdk 35
        versionCode 32
        versionName '3.2'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_FILE") ?: "release-keystore.jks"
            storeFile file(keystorePath)
            storePassword System.getenv("RELEASE_STORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
        }
    }
}
